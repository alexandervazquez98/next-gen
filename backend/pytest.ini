[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .
markers =
    unit: Unit tests — pure logic, no external dependencies
    integration: Integration tests — require mocked DB or external services
    slow: Tests that take longer than typical unit tests
    neo4j: Tests that interact with Neo4j (mocked or real)
    metric: Tests related to metric reconciliation and definitions
    event: Tests related to event lifecycle management
    auth: Authentication and authorization tests
    api: API/router tests
    env_required: Tests requiring a fully-fitted environment (Docker socket, pg_dump binary, host-mounted fixtures). Skipped by default; opt in with `-m env_required` or run inside the prtest container. See docs/testing-environment.md.
addopts =
    --strict-markers
    -v
    --tb=short
    --timeout=120
