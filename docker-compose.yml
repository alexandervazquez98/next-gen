services:
  # Graph Database
  neo4j:
    image: neo4j:5.15.0
    container_name: nexgen_neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    volumes:
      - ./docker/neo4j/data:/data
      - ./docker/neo4j/logs:/logs
      - ${BACKUP_DIR:-.docker/backups}:/backups
      - ./docker/neo4j/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "${NEO4J_USER}",
          "-p",
          "${NEO4J_PASSWORD}",
          "RETURN 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # PostgreSQL / TimescaleDB
  postgres:
    image: timescale/timescaledb:2.15.0-pg16
    container_name: nexgen_postgres
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nexgen_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexgen_password}
      - POSTGRES_DB=${POSTGRES_DB:-nexgen_auth}
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-.docker/backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Python Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexgen_backend
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-nexgen_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexgen_password}
      - POSTGRES_DB=${POSTGRES_DB:-nexgen_auth}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_INTERNAL_PORT:-5432}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TZ=${TZ:-UTC}
      - TIME_SYNC_MODE=${TIME_SYNC_MODE:-host}
      - TIME_SYNC_WARNING_MS=${TIME_SYNC_WARNING_MS:-1000}
      - TIME_SYNC_CRITICAL_MS=${TIME_SYNC_CRITICAL_MS:-5000}
      - TIME_SYNC_QUERY_TIMEOUT_S=${TIME_SYNC_QUERY_TIMEOUT_S:-1}
      - PYTHONPATH=/app
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://10.53.1.22:3010}
      - DISABLE_BACKEND_COLLECTOR=true
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      # PR 5 E2E journey (frontend/test/e2e/service-management-pr5.spec.ts)
      # logs in as admin/admin against the freshly seeded smoke stack.
      # Without these, backend/seed_admin.py generates a random password
      # (printed to logs but inaccessible to Playwright) on each startup,
      # so the journey would 404 on /auth/login. Smoke workflow materializes
      # .env from .env.example with admin/admin so this round-trips.
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin}
      - LM_STUDIO_ENABLED=${LM_STUDIO_ENABLED:-false}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-local-model}
      - LM_STUDIO_TIMEOUT_SECONDS=${LM_STUDIO_TIMEOUT_SECONDS:-15}
      - LM_STUDIO_MAX_TOKENS=${LM_STUDIO_MAX_TOKENS:-800}
      - AI_PROMPTS_DIR=/data/ai
      - ICMP_LATENCY_WARNING_MS=${ICMP_LATENCY_WARNING_MS:-100}
      - ICMP_LATENCY_CRITICAL_MS=${ICMP_LATENCY_CRITICAL_MS:-500}
      # Event prune / recovery lifecycle (fix-423)
      - EVENT_PRUNE_ENABLED=${EVENT_PRUNE_ENABLED:-true}
      - EVENT_PRUNE_INTERVAL_SECONDS=${EVENT_PRUNE_INTERVAL_SECONDS:-3600}
      - EVENT_PRUNE_BATCH_SIZE=${EVENT_PRUNE_BATCH_SIZE:-500}
      - EVENT_PRUNE_STALE_AFTER_SECONDS=${EVENT_PRUNE_STALE_AFTER_SECONDS:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BACKUP_DIR:-.docker/backups}:/backups
      - ${AI_PROMPTS_DIR_HOST:-.docker/ai}:/data/ai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Dedicated MQTT subscriber process
  mqtt-subscriber:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexgen_mqtt_subscriber
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scripts.mqtt_subscriber"]
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-nexgen_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-nexgen_auth}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_INTERNAL_PORT:-5432}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-nexgen_subscriber}
      - MQTT_MAPPING_BRIDGE_ENABLED=${MQTT_MAPPING_BRIDGE_ENABLED:-true}
      - MQTT_SUBSCRIBER_STALE_HEARTBEAT_SECONDS=${MQTT_SUBSCRIBER_STALE_HEARTBEAT_SECONDS:-90}
      - MQTT_MAPPING_BRIDGE_MISSED_HEARTBEAT_SECONDS=${MQTT_MAPPING_BRIDGE_MISSED_HEARTBEAT_SECONDS}
      - ENABLE_MQTT_SUBSCRIBER=true
      - PYTHONPATH=/app
    restart: unless-stopped

  # Frontend (Vite Service)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexgen_frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=${VITE_API_TARGET:-http://nexgen_backend:8000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Engines / Workers
  snmp-engine:
    build:
      context: ./backend
      dockerfile: engines/Dockerfile
    container_name: nexgen_snmp_worker
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-nexgen_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexgen_password}
      - POSTGRES_DB=${POSTGRES_DB:-nexgen_auth}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_INTERNAL_PORT:-5432}
      # ICMP polling: timeout in ms (default 3000), retries (default 2), debounce_count (default 3)
      - ICMP_TIMEOUT_MS=${ICMP_TIMEOUT_MS:-3000}
      - ICMP_RETRIES=${ICMP_RETRIES:-2}
      - ICMP_DEBOUNCE_COUNT=${ICMP_DEBOUNCE_COUNT:-3}
      - ICMP_LATENCY_WARNING_MS=${ICMP_LATENCY_WARNING_MS:-100}
      - ICMP_LATENCY_CRITICAL_MS=${ICMP_LATENCY_CRITICAL_MS:-500}
      # Scalable polling pipeline PR1 flags/defaults (behavior-changing flags remain off)
      - POLLING_PIPELINE_OBSERVE_ONLY=${POLLING_PIPELINE_OBSERVE_ONLY:-false}
      - POLLING_PG_QUEUE_ENABLED=${POLLING_PG_QUEUE_ENABLED:-false}
      - POLLING_SNMP_LEASED_WORKER=${POLLING_SNMP_LEASED_WORKER:-false}
      - POLLING_DB_WRITER_ENABLED=${POLLING_DB_WRITER_ENABLED:-false}
      - POLLING_BACKPRESSURE_ENABLED=${POLLING_BACKPRESSURE_ENABLED:-false}
      - POLLING_METADATA_CACHE_ENABLED=${POLLING_METADATA_CACHE_ENABLED:-false}
      - POLLING_TARGET_CYCLE_SECONDS=${POLLING_TARGET_CYCLE_SECONDS:-900}
      - POLLING_WORKERS=${POLLING_WORKERS:-8}
      - POLLING_DB_WRITERS=${POLLING_DB_WRITERS:-1}
      - POLLING_TASK_BATCH_SIZE=${POLLING_TASK_BATCH_SIZE:-100}
      - POLLING_RESULT_BATCH_SIZE=${POLLING_RESULT_BATCH_SIZE:-500}
      - POLLING_BACKPRESSURE_MAX_TASK_QUEUE_DEPTH=${POLLING_BACKPRESSURE_MAX_TASK_QUEUE_DEPTH:-100000}
      - POLLING_BACKPRESSURE_MAX_WRITER_LAG_SECONDS=${POLLING_BACKPRESSURE_MAX_WRITER_LAG_SECONDS:-120}
      - POLLING_BACKPRESSURE_RETRY_MAX_ATTEMPTS=${POLLING_BACKPRESSURE_RETRY_MAX_ATTEMPTS:-5}
      - POLLING_METADATA_CACHE_TTL_SECONDS=${POLLING_METADATA_CACHE_TTL_SECONDS:-300}
      - POLLING_BENCHMARK_CI_COUNT=${POLLING_BENCHMARK_CI_COUNT:-8000}
      - POLLING_BENCHMARK_METRICS_PER_CI=${POLLING_BENCHMARK_METRICS_PER_CI:-35}
      - POLLING_BENCHMARK_DURATION_SECONDS=${POLLING_BENCHMARK_DURATION_SECONDS:-0}
      - POLLING_BENCHMARK_PROTOCOL_MIX=${POLLING_BENCHMARK_PROTOCOL_MIX:-ICMP:0.15,SNMP:0.55,CLI:0.15,REST:0.10,MQTT_STUB:0.05}
      - POLLING_BENCHMARK_SINK=${POLLING_BENCHMARK_SINK:-synthetic}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys; from neo4j import GraphDatabase; d=GraphDatabase.driver(os.environ['NEO4J_URI'], auth=(os.environ['NEO4J_USER'], os.environ['NEO4J_PASSWORD'])); d.verify_connectivity(); d.close(); sys.exit(0)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
