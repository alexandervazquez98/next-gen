# Workflow: smoke (PR5 of ci-cd-pipeline)
#
# PR5 of the six-slice CI/CD chain (feature-branch-chain: PR1 → PR2 →
# PR3 → PR4 → PR5 → PR6). This lane is the **deployment gate** in v1
# (see openspec/changes/ci-cd-pipeline/specs/ci-cd-pipeline/spec.md
# "Smoke Lane and Playwright Gate" / R7, and the rollback policy v1 in
# the proposal). On push to main this workflow runs before the CD lane
# takes over (PR6).
#
# What this lane does (spec R7 scenario "Smoke validates serving
# paths"):
#   1. Ensure docker/postgres/data exists on the runner (R1 mitigation
#      — see docker/README.md).
#   2. Spin up the dev compose stack: postgres → neo4j → backend →
#      frontend. Service healthchecks gate the next step.
#   3. Wait up to 120s for backend root (GET /) to return HTTP 200, and
#      up to 90s for frontend root (GET /) to return 200. Either
#      timeout ⇒ workflow fail + ALWAYS tear down below.
#   4. Run Playwright smoke specs (frontend/test/e2e/*.spec.ts) which
#      assert (a) the frontend HTML carries the real product title and
#      the React mount point, and (b) the backend root returns JSON
#      `{ status: "System Operational", ... }`. See those specs for the
#      exact assertions.
#   5. ALWAYS tear the stack down with `docker compose down` (no `-v`
#      — see design.md R7 + scripts/safe-rebuild.sh convention;
#      never delete volumes in CI).
#
# Why a separate compose up instead of reusing the build lane's
# containers:
#   The build lane (PR4) builds images and smoke-runs them in
#   isolation; PR5 must prove the END-TO-END stack wiring, which means
#   compose up of all services together so healthchecks, networking,
#   and bind-mounts are exercised as one.
#
# Concurrency: cancels superseded PR runs to save runner minutes; never
# cancels a push to main / cicd/** so we keep the post-merge evidence.
#
# SHA pins (consistent with PR1..PR4):
#   - docker/setup-buildx-action: v3.12.0 -> 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#
# The compose wait loop is a real shell loop that calls `curl`; the
# `set -euo pipefail` ensures partial waits fail loud.

name: smoke

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "frontend/**"
      - "frontend/Dockerfile"
      - "frontend/Dockerfile.prod"
      - "frontend/nginx.conf"
      - "frontend/playwright.config.ts"
      - "frontend/test/e2e/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/**"
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - "scripts/**"
      - ".github/workflows/smoke.yml"
  push:
    branches:
      - main
      - "cicd/**"
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "frontend/**"
      - "frontend/Dockerfile"
      - "frontend/Dockerfile.prod"
      - "frontend/nginx.conf"
      - "frontend/playwright.config.ts"
      - "frontend/test/e2e/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/**"
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/requirements-dev.txt"
      - "scripts/**"
      - ".github/workflows/smoke.yml"

# Cancel superseded PR runs; keep push runs to the end so post-merge
# evidence is preserved.
concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "3000"
      BACKEND_HEALTH_TIMEOUT_SECONDS: "120"
      FRONTEND_HEALTH_TIMEOUT_SECONDS: "90"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:latest

      # R1 mitigation — see docker/README.md. Compose bind-mount
      # `./docker/postgres/data` fails on engines that refuse to
      # auto-create the source directory. Make it explicit so smoke is
      # reproducible across hosted runner versions.
      - name: Ensure host bind-mount directories exist (R1)
        run: |
          set -euo pipefail
          mkdir -p docker/postgres/data docker/neo4j/data docker/neo4j/logs .docker/backups
          # The bind-mount source directories must be owned by the UID/GID
          # the container process runs as, otherwise postgres (UID 999) and
          # neo4j (UID 7474) refuse to write to the mount. The runner user
          # created them with the runner's UID; chown via sudo (hosted
          # runners have unrestricted sudo).
          sudo chown -R 999:999  docker/postgres/data .docker/backups
          sudo chown -R 7474:7474 docker/neo4j/data docker/neo4j/logs
          ls -la docker/postgres/data docker/neo4j/data docker/neo4j/logs .docker/backups

      # Materialize a test-only .env from .env.example with throwaway
      # credentials. The smoke stack is ephemeral (docker compose down at
      # job end, no -v) so real secrets are not required; the goal is to
      # satisfy docker-compose.yml's `env_file: .env` requirement and let
      # the data tier pass healthchecks.
      - name: Materialize test-only .env
        run: |
          set -euo pipefail
          cp .env.example .env
          # Replace any password placeholder with a deterministic CI-only value.
          sed -i "s/YourStrongPassword#2026/ci-smoke-password-12345/g" .env
          sed -i "s/ChangeMe_SomethingVeryLongAndSecure_123456/ci-smoke-jwt-secret-very-long-and-secure/g" .env
          # Override BACKUP_DIR to a workspace-local path (avoid the default
          # .docker/backups, which is fine but we make it explicit for CI).
          grep -q '^BACKUP_DIR=' .env || echo "BACKUP_DIR=.docker/backups" >> .env
          echo "--- .env (sanitized, lines 1-20) ---"
          sed -e 's/=.*/=<redacted>/' .env | head -20

      # Backend-stack first: postgres + neo4j + backend. The `depends_on`
      # healthchecks in docker-compose.yml gate the order; we additionally
      # poll backend health directly with curl because FastAPI readiness
      # is what PR5 cares about.
      - name: Compose up data tier (postgres + neo4j + backend)
        run: |
          set -euo pipefail
          docker compose up -d postgres neo4j backend

      # Wait up to BACKEND_HEALTH_TIMEOUT_SECONDS (120s default) for
      # the FastAPI root to return 200. The curl check is the SAME
      # contract the smoke spec verifies (backend/main.py GET /).
      - name: Wait for backend health (timeout ${BACKEND_HEALTH_TIMEOUT_SECONDS}s)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + BACKEND_HEALTH_TIMEOUT_SECONDS ))
          until curl -sf "http://localhost:${BACKEND_PORT}/" > /dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::backend did not become healthy within ${BACKEND_HEALTH_TIMEOUT_SECONDS}s"
              docker compose ps || true
              docker compose logs --no-color --tail=200 backend || true
              exit 1
            fi
            sleep 2
          done
          echo "backend healthy at http://localhost:${BACKEND_PORT}/"

      # Frontend up after backend is reachable. Vite dev binds to 3000
      # inside the container; the host-side port is the same (see
      # docker-compose.yml frontend.ports).
      - name: Compose up frontend
        run: |
          set -euo pipefail
          docker compose up -d frontend

      - name: Wait for frontend health (timeout ${FRONTEND_HEALTH_TIMEOUT_SECONDS}s)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + FRONTEND_HEALTH_TIMEOUT_SECONDS ))
          until curl -sf "http://localhost:${FRONTEND_PORT}/" > /dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::frontend did not become healthy within ${FRONTEND_HEALTH_TIMEOUT_SECONDS}s"
              docker compose ps || true
              docker compose logs --no-color --tail=200 frontend || true
              exit 1
            fi
            sleep 2
          done
          echo "frontend healthy at http://localhost:${FRONTEND_PORT}/"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # corepack pins pnpm to the version declared in package.json
      # (`packageManager: pnpm@10.12.1`). Without `corepack prepare`, the
      # node-bundled pnpm 11.x is used, which refuses to switch versions
      # and aborts with "Your current pnpm is v11.x". The frontend
      # preinstall guard also blocks npm — see frontend/package.json.
      #
      # Note: do NOT add `cache: pnpm` to setup-node above. That option
      # invokes pnpm during setup-node, before corepack has activated
      # the pinned version, and fails with "Unable to locate executable
      # file: pnpm".
      - name: Enable Corepack + activate pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm --dir frontend install --frozen-lockfile

      # Install the chromium browser binary + its apt deps. --with-deps
      # needs sudo on Linux; the ubuntu-latest runner has it by
      # default.
      - name: Install Playwright browsers
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run Playwright smoke specs
        run: pnpm --dir frontend run test:e2e

      # Even on failure, upload the report so reviewers can see WHY.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # ALWAYS tear the stack down — success OR failure. NO `-v`
      # because:
      #   - design.md R7: "smoke must not delete volumes"
      #   - scripts/safe-rebuild.sh convention: pre-rebuild backup is
      #     kept around for human recovery in v1 (rollback policy v1).
      # If teardown itself fails we still mark the workflow as failed
      # so the operator notices (rare in practice; usually means the
      # runner is out of disk or docker daemon hung).
      - name: Tear down compose stack (always, no -v)
        if: always()
        run: |
          set -euo pipefail
          docker compose down --remove-orphans || {
            echo "::error::docker compose down failed; investigate runner state"
            docker compose ps || true
            exit 1
          }
          echo "compose stack torn down without volume deletion"
