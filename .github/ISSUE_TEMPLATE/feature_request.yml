name: Feature Request
description: Submit a new feature or improvement
title: "feat(scope): [short description]"
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: "I have searched existing issues and this is not a duplicate"
          required: true
        - label: "I understand this issue needs status:approved before a PR can be opened"
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: The pain point this feature solves. Be specific about current limitations
      placeholder: |
        The system currently monitors CIs via SNMP polling, but does not have the capability
        to ingest telemetry from IoT RTU devices that publish sensor data over MQTT...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How it should work from a technical and user perspective
      placeholder: |
        Phase 1: RTU as CI + MQTT Subscriber Foundation
        - Add RTU device type as a new CI subtype in Neo4j
        - Define Sensor entity attached to RTU
        - Implement MQTT subscriber service...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the codebase is primarily affected
      options:
        - Backend
        - Frontend
        - Database
        - Multiple (full-stack)
        - Infrastructure/DevOps
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, examples, architecture diagrams, references
      placeholder: |
        Architecture:
        [S475E RTU] → MQTT Broker → [Backend] → Neo4j/TimescaleDB

        Cluster definition:
        - Cluster = CIs sharing the same location_id
        - RTU device → same location → same cluster as other CIs
    validations:
      required: false
